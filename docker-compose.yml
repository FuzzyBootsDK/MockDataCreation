services:
  mockgen:
    build: .
    image: mockgen:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - mockgen-data:/data
    environment:
      # Referenced from connection profiles as ${MOCKGEN_SECRET_PG_PASSWORD} / ${MOCKGEN_SECRET_MSSQL_PASSWORD}.
      MOCKGEN_SECRET_PG_PASSWORD: mockgen
      MOCKGEN_SECRET_MSSQL_PASSWORD: "Mockgen!Passw0rd"

  postgres:
    profiles: ["dbs"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mockgen
      POSTGRES_PASSWORD: mockgen
      POSTGRES_DB: mockgen
    ports:
      - "127.0.0.1:5432:5432"

  mssql:
    profiles: ["dbs"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Mockgen!Passw0rd"
    ports:
      - "127.0.0.1:1433:1433"

volumes:
  mockgen-data:
